<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CasaFlix</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0d0d;
      --bg2:     #181818;
      --bg3:     #242424;
      --accent:  #e50914;
      --accent2: #b20710;
      --text:    #ffffff;
      --text2:   #aaaaaa;
      --radius:  10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: linear-gradient(to bottom, rgba(0,0,0,.95) 0%, rgba(0,0,0,.6) 80%, transparent 100%);
      backdrop-filter: blur(6px);
      padding: 14px 40px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: -1px;
      flex-shrink: 0;
      user-select: none;
    }

    .search-wrap {
      flex: 1;
      max-width: 380px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text2);
      pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px;
      padding: 9px 14px 9px 38px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    .search-wrap input:focus {
      border-color: rgba(255,255,255,.4);
      background: rgba(255,255,255,.12);
    }
    .search-wrap input::placeholder { color: var(--text2); }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .icon-btn {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.15);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: rgba(255,255,255,.15); }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 10px 40px 0;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text2);
      font-size: 15px;
      font-weight: 600;
      padding: 8px 22px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .tab-btn.active {
      background: var(--bg3);
      color: #fff;
    }
    .tab-btn:hover:not(.active) { color: #fff; }

    main { padding: 20px 40px 60px; }

    .section-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 18px;
    }
    .section-title {
      font-size: 19px;
      font-weight: 700;
    }
    .section-count {
      font-size: 13px;
      color: var(--text2);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .card {
      cursor: pointer;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg3);
      transition: transform .22s cubic-bezier(.25,.8,.25,1), box-shadow .22s;
      position: relative;
    }
    .card:hover {
      transform: scale(1.06);
      box-shadow: 0 10px 32px rgba(0,0,0,.7);
      z-index: 10;
    }
    .card:hover .card-overlay { opacity: 1; }

    .card-poster-wrap {
      width: 100%;
      aspect-ratio: 2/3;
      position: relative;
      overflow: hidden;
    }
    .card-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(145deg, #1c1c2e 0%, #2a2a4a 50%, #1a1a2e 100%);
      padding: 16px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,.75);
      line-height: 1.4;
    }
    .card-placeholder span { font-size: 28px; }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.85) 0%, transparent 50%);
      display: flex;
      align-items: flex-end;
      padding: 12px;
      opacity: 0;
      transition: opacity .2s;
    }
    .play-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .card-info { padding: 9px 10px 10px; }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      font-size: 11px;
      color: var(--text2);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .badge {
      background: rgba(255,255,255,.1);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 600;
    }

    .state-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text2);
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255,255,255,.08);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .75s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── EPISODE MODAL ───────────────────────────────────── */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(0,0,0,.75);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-bg.active { display: flex; }

    .modal-box {
      background: var(--bg2);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 28px;
      width: 420px;
      max-width: 100%;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .modal-subtitle {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 22px;
    }

    .ep-row {
      display: flex;
      gap: 14px;
      margin-bottom: 22px;
    }
    .ep-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
    }
    .ep-field label { font-size: 12px; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
    .ep-field select {
      width: 100%;
      background: var(--bg3);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    .ep-field select:focus { border-color: rgba(255,255,255,.35); }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .btn {
      padding: 10px 22px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background .2s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent2); }
    .btn-ghost { background: var(--bg3); color: #fff; }
    .btn-ghost:hover { background: #333; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    @media (max-width: 640px) {
      header { padding: 12px 16px; }
      .tabs, main { padding-left: 16px; padding-right: 16px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
      .search-wrap { max-width: none; flex: 1; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🎬 CasaFlix</div>
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="search-input" placeholder="Cerca film o serie…" autocomplete="off">
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tab-movie" onclick="switchTab('movie')">🎬 Film</button>
  <button class="tab-btn" id="tab-tv" onclick="switchTab('tv')">📺 Serie TV</button>
</div>

<main>
  <div class="section-header">
    <span class="section-title" id="section-title">Film disponibili</span>
    <span class="section-count" id="section-count"></span>
  </div>
  <div class="grid" id="grid">
    <div class="state-box">
      <div class="spinner"></div>
      <p>Caricamento catalogo…</p>
    </div>
  </div>
</main>

<!-- EPISODE MODAL -->
<div class="modal-bg" id="ep-modal">
  <div class="modal-box">
    <div class="modal-title" id="ep-title">Seleziona episodio</div>
    <div class="modal-subtitle">Scegli la stagione e l'episodio</div>
    <div class="ep-row">
      <div class="ep-field">
        <label>Stagione</label>
        <select id="ep-season"></select>
      </div>
      <div class="ep-field">
        <label>Episodio</label>
        <select id="ep-episode"></select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEpModal()">Annulla</button>
      <button class="btn btn-primary" onclick="confirmEpisode()">&#9654; Apri in nuova scheda</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────
let catalogs  = { movie: [], tv: [] };
let activeTab = 'movie';
let selectedShow = null;

// ─────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  await loadCatalog();
  document.getElementById('search-input').addEventListener('input', onSearch);
  document.getElementById('ep-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeEpModal();
  });
  document.getElementById('ep-season').addEventListener('change', populateEpisodes);
});

// ─────────────────────────────────────────────────────────
// CATALOG LOADER
// ─────────────────────────────────────────────────────────
async function loadCatalog() {
  try {
    const r = await fetch('data/catalog.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const byYearDesc = (a, b) => (b.year || 0) - (a.year || 0);
    catalogs.movie = (data.movie || []).map(it => ({ ...it, tmdb_id: String(it.tmdb_id), type: 'movie' })).sort(byYearDesc);
    catalogs.tv    = (data.tv    || []).map(it => ({ ...it, tmdb_id: String(it.tmdb_id), type: 'tv'    })).sort(byYearDesc);
  } catch (err) {
    console.error('Catalog load failed:', err);
    showCatalogError();
    return;
  }
  renderCurrentTab();
}

function showCatalogError() {
  document.getElementById('grid').innerHTML =
    '<div class="state-box" style="grid-column:1/-1">' +
    '<p style="font-size:40px">⚠️</p>' +
    '<p style="margin-top:12px;font-weight:600">Catalogo non disponibile</p>' +
    '<p style="color:var(--text2);margin-top:6px">Rigenera <code>data/catalog.json</code> con <code>build_catalog.py</code>.</p>' +
    '</div>';
  document.getElementById('section-count').textContent = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeEpModal();
  if (e.key === 'Enter' && document.getElementById('ep-modal').classList.contains('active')) confirmEpisode();
});

// ─────────────────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────────────────
function switchTab(type) {
  activeTab = type;
  document.getElementById('tab-movie').classList.toggle('active', type === 'movie');
  document.getElementById('tab-tv').classList.toggle('active', type === 'tv');
  document.getElementById('search-input').value = '';
  renderCurrentTab();
}

// ─────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────
function renderCurrentTab() {
  const items = catalogs[activeTab] || [];
  const label = activeTab === 'movie' ? 'Film' : 'Serie TV';
  document.getElementById('section-title').textContent = `${label} disponibili`;

  if (items.length === 0) {
    document.getElementById('section-count').textContent = '';
    document.getElementById('grid').innerHTML =
      `<div class="state-box"><div class="spinner"></div><p>Caricamento…</p></div>`;
    return;
  }

  renderGrid(items);
}
function renderGrid(items) {
  document.getElementById('section-count').textContent = `${items.length} titoli`;
  const grid = document.getElementById('grid');

  if (items.length === 0) {
    grid.innerHTML = `<div class="state-box"><p style="font-size:40px">🔍</p><p style="margin-top:12px">Nessun risultato.</p></div>`;
    return;
  }

  grid.innerHTML = items.map(item => {
    const posterHtml = item.poster
      ? `<img class="card-poster" src="${escH(item.poster)}" alt="${escH(item.title)}" loading="lazy"
             onerror="this.style.display='none'; this.parentElement.querySelector('.card-placeholder').style.display='flex'">`
      : '';
    const placeholderStyle = item.poster ? 'display:none' : '';
    const yearText = item.year ? String(item.year) : '';

    return `
      <div class="card" onclick="onCardClick('${escH(item.tmdb_id)}','${item.type}')">
        <div class="card-poster-wrap">
          ${posterHtml}
          <div class="card-placeholder" style="${placeholderStyle}">
            <span>${item.type === 'movie' ? '🎬' : '📺'}</span>
            ${escH(item.title)}
          </div>
          <div class="card-overlay">
            <button class="play-btn">▶</button>
          </div>
        </div>
        <div class="card-info">
          <div class="card-title">${escH(item.title)}</div>
          <div class="card-meta">
            ${yearText ? `<span>${escH(yearText)}</span>` : ''}
            <span class="badge">${item.type === 'movie' ? 'Film' : 'Serie'}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

// ─────────────────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────────────────
function onSearch(e) {
  const q = e.target.value.trim().toLowerCase();
  const items = catalogs[activeTab];
  const label = activeTab === 'movie' ? 'Film' : 'Serie TV';

  if (!q) {
    document.getElementById('section-title').textContent = `${label} disponibili`;
    renderGrid(items);
    return;
  }

  const filtered = items.filter(i => i.title.toLowerCase().includes(q));
  document.getElementById('section-title').textContent = `Risultati per "${q}"`;
  renderGrid(filtered);
}

// ─────────────────────────────────────────────────────────
// CARD CLICK
// ─────────────────────────────────────────────────────────
function onCardClick(tmdbId, type) {
  const catalog = catalogs[type] || [];
  const item = catalog.find(i => i.tmdb_id === tmdbId);
  if (!item) return;
  
  if (type === 'movie') {
    // Apri direttamente in una nuova scheda
    const url = `https://vixsrc.to/movie/${item.tmdb_id}?lang=it`;
    window.open(url, '_blank');
  } else {
    // Per le serie TV, mostra il modal per scegliere stagione/episodio
    openEpModal(item);
  }
}

// ─────────────────────────────────────────────────────────
// EPISODE MODAL
// ─────────────────────────────────────────────────────────
function openEpModal(item) {
  selectedShow = item;
  document.getElementById('ep-title').textContent = item.title;

  const seasonSel = document.getElementById('ep-season');
  const seasons = item.seasons || [];
  seasonSel.innerHTML = seasons.length
    ? seasons.map(s => `<option value="${s.n}">Stagione ${s.n} (${s.episodes} ep.)</option>`).join('')
    : '<option value="1">Stagione 1</option>';

  populateEpisodes();
  document.getElementById('ep-modal').classList.add('active');
  setTimeout(() => seasonSel.focus(), 50);
}

function populateEpisodes() {
  if (!selectedShow) return;
  const seasonSel = document.getElementById('ep-season');
  const epSel = document.getElementById('ep-episode');
  const n = parseInt(seasonSel.value, 10);
  const seasons = selectedShow.seasons || [];
  const found = seasons.find(s => s.n === n);
  const count = found ? found.episodes : 1;
  epSel.innerHTML = '';
  for (let i = 1; i <= count; i++) {
    epSel.insertAdjacentHTML('beforeend', `<option value="${i}">Episodio ${i}</option>`);
  }
}

function closeEpModal() {
  document.getElementById('ep-modal').classList.remove('active');
  selectedShow = null;
}

function confirmEpisode() {
  if (!selectedShow) return;
  const tmdbId = selectedShow.tmdb_id;
  const s = Math.max(1, parseInt(document.getElementById('ep-season').value) || 1);
  const e = Math.max(1, parseInt(document.getElementById('ep-episode').value) || 1);
  closeEpModal();
  window.open(`https://vixsrc.to/tv/${tmdbId}/${s}/${e}`, '_blank');
}

// ─────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────
function escH(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
